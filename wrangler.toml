name = "konoha-add"
main = "worker/index.js"
compatibility_date = "2026-08-18"

# Setelah deploy pertama, tambahkan domain di dashboard Cloudflare:
#   Workers & Pages -> konoha-add -> Settings -> Domains & Routes -> Add Custom Domain
#   Masukkan: add.konohaserver.id
#
# Atau aktifkan baris di bawah bila zona konohaserver.id sudah ada di akun Cloudflare
# yang sama, lalu jalankan: npx wrangler deploy
#
# routes = [
#   { pattern = "add.konohaserver.id", custom_domain = true }
# ]
